[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbot"
version = "0.2.0"
description = "Universal highlight clipping, episodic movie splitting, and publishing automation engine for Gaming (GTA 6, etc.), Sports, Movies, and Cartoons across Twitch, Kick, and YouTube"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.5",
    "rich>=13.7.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.2",
    "aiohttp>=3.10.11",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "yt-dlp>=2024.11.4",
    "ffmpeg-python>=0.2.0",
    "librosa>=0.10.2",
    "numpy>=1.26.4,<2.2.0",
    "opencv-python-headless>=4.10.0.84,<5.0.0",
    "av>=11.0.0,<18.0.0",
    "pillow>=10.4.0",
    "faster-whisper>=1.0.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "apscheduler>=3.10.4",
    "filelock>=3.16.1",
    "loguru>=0.7.2",
    "twitchAPI>=4.2.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
clipbot = "clipbot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
