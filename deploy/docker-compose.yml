services:
  clipbot-pipeline:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: clipbot-pipeline
    restart: unless-stopped
    command: ["clipbot", "daemon", "--profile", "gta_chaos"]
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    env_file:
      - ../.env
    environment:
      - CLIPBOT_DB_PATH=data/state.db

  clipbot-review:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: clipbot-review
    restart: unless-stopped
    command: ["clipbot", "review", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    env_file:
      - ../.env
