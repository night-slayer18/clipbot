# Grand Theft Auto VI (GTA 6) Chaos Profile — Vice City pursuits, shootouts, airboats, stunts
name: "gta6_chaos"
description: "High-action GTA 6: Vice City police pursuits, shootouts, explosions, WASTED moments, Leonida chaos"

signal_weights:
  audio_rms: 0.30          # Screaming, sirens, explosions, supercars
  audio_onset: 0.15        # Sudden loud sound transients, gunshots, impact thuds
  audio_pitch: 0.10        # Vocal pitch spikes, screaming, laughing reactions
  chat_velocity: 0.25      # Chat spike on KEKW / 💀 / GTA 6 hype
  visual_impact: 0.10      # High-impact damage or elimination screen detected
  transcript_hype: 0.10    # 'Vice City', 'cops', 'wasted', 'run', 'shoot', 'busted'

clip:
  pre_pad_seconds: 5       # Roll back before action peak
  post_pad_seconds: 7      # Keep aftermath & reaction
  min_duration: 25
  max_duration: 55

chat_emotes:
  high: ["GTA6", "VICECITY", "KEKW", "OMEGALUL", "💀", "LUL", "W", "LEONIDA"]
  medium: ["WTF", "HUH", "OMG", "monkaW", "NOOO", "L", "CLIP", "HYPE"]
  low: ["Pog", "PogChamp", "POGGERS"]

transcript_keywords:
  high: ["gta 6", "vice city", "wasted", "busted", "no way", "run", "shoot", "cops", "dead"]
  medium: ["leonida", "police", "officer", "get in", "helicopter", "swat"]

scoring:
  min_gates_required: 2      # Minimum distinct signals that must fire for a window to pass the absolute gate

render:
  layout: "split_stack"    # Facecam on top + gameplay on bottom
  caption_style: "karaoke"
  caption_color: "#FF007F" # Vice City neon pink/magenta
